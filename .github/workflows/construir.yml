# Construye el ejecutable del Migrador de Correo en las tres plataformas.
#
# Resuelve el problema de fondo: PyInstaller genera un binario para el sistema
# donde se ejecuta, asi que sin esto hace falta un equipo de cada tipo. Aqui los
# pone GitHub.
#
# Se dispara a mano desde la pestania Actions, o al publicar una etiqueta. No en
# cada empujon: construir tres binarios por cada cambio de una coma no aporta.
#
# Los binarios quedan como artefactos descargables durante 90 dias.

name: Construir ejecutables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  construir:
    strategy:
      fail-fast: false      # que falle uno no debe cancelar los otros dos
      matrix:
        include:
          - so: windows-latest
            nombre: windows-x86_64
            binario: dist/MigradorCorreo.exe
          - so: macos-latest
            nombre: macos-arm64
            binario: dist/MigradorCorreo
          # GitHub esta retirando los ejecutores macos-13, que eran los ultimos
          # con Intel; una corrida los espero siete horas hasta que la cancelo.
          # macos-15-intel es el reemplazo. Si tampoco estuviera disponible, el
          # binario para Mac Intel se construye en local desde un Mac con Apple
          # Silicon usando Rosetta, que es lo que hace receta/construir.sh.
          - so: macos-15-intel
            nombre: macos-x86_64
            binario: dist/MigradorCorreo
          - so: ubuntu-latest
            nombre: linux-x86_64
            binario: dist/MigradorCorreo

    runs-on: ${{ matrix.so }}
    name: ${{ matrix.nombre }}
    # Sin esto, un ejecutor que no llega deja el trabajo en cola durante horas.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requisitos.txt

      - name: Inyectar la configuracion del tenant
        # Los identificadores no estan en el codigo, que es publico. Vienen de
        # los secretos del repositorio y solo existen durante la construccion.
        # Si no estan configurados, el binario sale generico y funciona igual
        # poniendole un config.json al lado.
        env:
          MIGRADOR_APP_ID: ${{ secrets.MIGRADOR_APP_ID }}
          MIGRADOR_TENANT_ID: ${{ secrets.MIGRADOR_TENANT_ID }}
        run: python receta/generar_config.py

      - name: Construir
        run: pyinstaller --noconfirm --clean receta/MigradorCorreo.spec

      - name: Firmar (solo Windows)
        # El certificado NO vive en el repositorio y no debe vivir nunca ahi.
        # Una llave de firma de codigo en un repositorio la puede extraer
        # cualquiera con acceso de lectura, y sirve para firmar malware que
        # Windows presentara como proveniente de Legacy. Por eso llega como
        # secreto del repositorio, se materializa en un archivo temporal del
        # ejecutor durante la construccion, y se borra en el bloque finally
        # pase lo que pase.
        #
        # Si los secretos no estan configurados, el paso no falla: avisa y sigue.
        # Un binario sin firmar es peor que uno firmado, pero mejor que ningun
        # binario.
        if: matrix.so == 'windows-latest'
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            Write-Host "Sin certificado configurado; el binario sale sin firmar."
            Write-Host "Define los secretos WINDOWS_CERT_PFX_BASE64 y WINDOWS_CERT_PASSWORD."
            exit 0
          }

          # signtool no esta en el PATH del ejecutor: vive en el SDK de Windows y
          # hay una copia por version. Se toma la mas reciente.
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" `
                      -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "No se encontro signtool.exe en el SDK de Windows." }

          $pfx = Join-Path $env:RUNNER_TEMP "firma.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))

            # El sellado de tiempo no es opcional: sin el, la firma deja de ser
            # valida el dia que expire el certificado, y los binarios ya
            # repartidos empiezan a dar aviso de golpe.
            & $signtool.FullName sign `
              /f $pfx /p $env:CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              dist\MigradorCorreo.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign fallo con codigo $LASTEXITCODE" }

            & $signtool.FullName verify /pa /v dist\MigradorCorreo.exe
            if ($LASTEXITCODE -ne 0) { throw "la firma no verifica" }
            Write-Host "Binario firmado y verificado."
          }
          finally {
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
          }

      - name: Firma ad-hoc (solo macOS)
        if: startsWith(matrix.so, 'macos')
        run: codesign --force --deep --sign - dist/MigradorCorreo || true

      - name: Verificar
        # La verificacion es parte de la construccion, no un extra: si el binario
        # no arranca o no negocia TLS con los servidores, este trabajo debe
        # fallar y no publicar nada.
        run: python verificar.py

      - name: Publicar el binario
        uses: actions/upload-artifact@v4
        with:
          name: MigradorCorreo-${{ matrix.nombre }}
          path: |
            ${{ matrix.binario }}
            LEEME-PRIMERO.txt
          retention-days: 90
          if-no-files-found: error
